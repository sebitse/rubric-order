{
  "schema_version": "3.0",
  "prompt_version": "3.0",
  "updater_mode": "mixed",
  "seed": 42,
  "dataset": {
    "path": "E:\\JUDGe\\HelpSteer2",
    "format": "auto",
    "columns": {"prompt": "prompt", "response": "response", "label": "helpfulness"},
    "train_split": "train",
    "validation_split": "validation"
  },
  "sampling": {
    "calibration_blocks": 10,
    "examples_per_score": 2,
    "heldout_prompts": 25,
    "responses_per_prompt": 2
  },
  "orders": ["ascending", "descending", "random", "reverse_random"],
  "methods": ["static", "batch", "sequential"],
  "models": {
    "updater": "qwen3:14b",
    "judge": "qwen3:14b",
    "base_url": "http://localhost:11434",
    "temperature": 0,
    "context_length": 16384,
    "updater_max_tokens": 650,
    "judge_max_tokens": 25,
    "seed": 42,
    "timeout_seconds": 300,
    "unload_after_stage": true,
    "think": false
  },
  "rubric": {"initial": "rubrics/initial_helpfulness_v2.json", "max_validation_retries": 2},
  "inventory_v3": {
    "path": "rubrics/adaptive_criterion_inventory_v3.json",
    "initial": "rubrics/initial_helpfulness_v3.json",
    "core_reference": "rubrics/initial_helpfulness_v2.json",
    "maximum_selected": 2
  },
  "prompts": {
    "sequential": "prompts/update_sequential_v2.txt",
    "batch": "prompts/induce_batch_v2.txt",
    "constrained_sequential": "prompts/update_sequential_inventory_v3.txt",
    "constrained_batch": "prompts/induce_batch_inventory_v3.txt",
    "judge": "prompts/judge_anchor_first_v2.txt",
    "judge_absolute": "prompts/judge_absolute_v2.txt",
    "judge_anchor_first": "prompts/judge_anchor_first_v2.txt"
  },
  "context": {
    "safety_margin_tokens": 1024,
    "minimum_observed_headroom_tokens": 256,
    "max_prompt_characters": 1200,
    "max_response_characters": 2400
  },
  "analysis": {"bootstrap_repetitions": 10000, "confidence": 0.95, "make_plots": true},
  "repeat_control": {
    "enabled": true,
    "blocks": [0, 4, 9],
    "orders": ["random"],
    "methods": ["batch", "sequential"],
    "replicates": [1, 2]
  },
  "constrained_ablation": {
    "blocks": [0, 4, 9],
    "orders": ["ascending", "descending", "random", "reverse_random"],
    "methods": ["constrained_batch", "constrained_sequential"],
    "repeat_control": false,
    "preregistered": true
  },
  "drift_annotations": {
    "required_before_judging": true,
    "automated_flags_are_heuristics_only": true
  },
  "exclude_manifests": [
    {"path": "runs/pilot-001/manifest.json", "required": true},
    {"path": "runs/judge-validation-v2/manifest.json", "required": true},
    {"path": "runs/pilot-002/manifest.json", "required": true},
    {"path": "runs/pilot-003/manifest.json", "required": true}
  ],
  "approved_judge_artifact": "runs/judge-validation-v2/judge_validation_summary.json",
  "allow_partial_results": false,
  "output_root": "runs"
}
